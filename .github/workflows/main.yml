app_name: IJAZ DETAILS
description: Personal & Family Profile App - single file HTML app
file_name: index.html
html_content: |-
  <!DOCTYPE html>
  <html lang="en" class="h-full">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>IJAZ DETAILS - Personal & Family Profile App</title>

      <!-- Tailwind CSS & Font Awesome Icons -->
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

      <!-- JSZip Library for Client-side ZIP Generation -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

      <script>
          tailwind.config = {
              darkMode: 'class',
              theme: {
                  extend: {
                      colors: {
                          brand: {
                              50: '#f0fdf4',
                              100: '#dcfce7',
                              500: '#22c55e',
                              600: '#16a34a',
                              700: '#15803d',
                              800: '#166534',
                              900: '#14532d',
                          }
                      },
                      fontFamily: {
                          sans: ['Plus Jakarta Sans', 'sans-serif'],
                          urdu: ['Noto Nastaliq Urdu', 'serif'],
                      }
                  }
              }
          }
      </script>
      <style>
          ::-webkit-scrollbar {
              width: 4px;
              height: 4px;
          }
          ::-webkit-scrollbar-track {
              background: transparent;
          }
          ::-webkit-scrollbar-thumb {
              background: rgba(100, 116, 139, 0.3);
              border-radius: 999px;
          }
          .urdu-text {
              font-family: 'Noto Nastaliq Urdu', serif;
              line-height: 2.2;
          }
          .glass-header {
              background: rgba(255, 255, 255, 0.92);
              backdrop-filter: blur(16px);
              -webkit-backdrop-filter: blur(16px);
          }
          .dark .glass-header {
              background: rgba(15, 23, 42, 0.92);
          }
          .active-tab {
              color: #16a34a !important;
              font-weight: 800 !important;
          }
          .no-scrollbar::-webkit-scrollbar {
              display: none;
          }
          .no-scrollbar {
              -ms-overflow-style: none;
              scrollbar-width: none;
          }
          body {
              touch-action: manipulation;
              -webkit-tap-highlight-color: transparent;
          }
      </style>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors duration-200">

      <div id="app" class="max-w-md mx-auto w-full min-h-screen bg-slate-50 dark:bg-slate-900 shadow-2xl flex flex-col relative pb-24 border-x border-slate-200 dark:border-slate-800">

          <!-- Top Navigation Header -->
          <header class="sticky top-0 z-30 glass-header border-b border-slate-200/80 dark:border-slate-800/80 px-4 py-3 flex items-center justify-between shadow-sm">
              <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/20 font-black text-xl">
                      I
                  </div>
                  <div>
                      <h1 class="font-extrabold text-base tracking-tight leading-none text-slate-900 dark:text-white">IJAZ DETAILS</h1>
                      <p class="text-[10px] text-brand-600 dark:text-brand-400 font-bold tracking-wide uppercase">Identity & Media Vault</p>
                  </div>
              </div>

              <div class="flex items-center gap-2">
                  <!-- Direct Android Studio ZIP Button -->
                  <button onclick="downloadAndroidZip()" title="Download Android Studio Project ZIP" class="p-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white hover:opacity-90 active:scale-95 transition shadow-sm flex items-center gap-1.5 text-xs font-bold">
                      <i class="fa-solid fa-file-zipper"></i>
                      <span class="text-[11px] font-extrabold hidden sm:inline">Android ZIP</span>
                  </button>

                  <!-- Urdu Hints Toggle -->
                  <button onclick="toggleUrduLabels()" title="Toggle Urdu Hints" class="px-2.5 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 font-bold text-xs transition">
                      اردو
                  </button>

                  <!-- Dark / Light Theme Toggle -->
                  <button onclick="toggleDarkMode()" title="Toggle Dark/Light Mode" class="p-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
                      <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                  </button>
              </div>
          </header>

          <!-- Main View Container -->
          <main class="flex-1 p-4 overflow-y-auto space-y-5">

              <!-- VIEW 1: DASHBOARD -->
              <section id="view-dashboard" class="space-y-5">
                  <!-- Who Am I Hero Profile Card -->
                  <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-brand-950 to-slate-900 text-white p-5 shadow-2xl border border-slate-800">
                      <div class="absolute -right-8 -bottom-8 w-36 h-36 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>

                      <div class="flex items-start justify-between relative z-10">
                          <div class="space-y-1">
                              <span class="inline-block text-[10px] font-bold uppercase tracking-wider text-brand-300 bg-brand-500/20 px-3 py-1 rounded-full border border-brand-500/30">
                                  Who I Am & What I Do / تعارف
                              </span>
                              <h2 id="hero-name" class="text-2xl font-black tracking-tight text-white mt-1">IJAZ WA2</h2>
                              <p id="hero-role" class="text-xs text-brand-200 font-medium">Software Developer & Tech Creator</p>
                          </div>

                          <!-- Interactive Profile Picture Upload Circle -->
                          <div class="relative group cursor-pointer" onclick="triggerProfilePhotoUpload()" title="Tap to upload profile photo">
                              <div id="hero-avatar" class="w-16 h-16 rounded-2xl bg-slate-800 border-2 border-brand-500/50 flex items-center justify-center text-brand-400 font-bold text-xl shadow-inner overflow-hidden object-cover">
                                  IW
                              </div>
                              <div class="absolute inset-0 bg-black/60 rounded-2xl flex flex-col items-center justify-center text-white text-[9px] font-bold opacity-0 group-hover:opacity-100 transition">
                                  <i class="fa-solid fa-camera text-xs mb-0.5"></i>
                                  <span>Change</span>
                              </div>
                          </div>
                          <input type="file" id="profile-photo-input" class="hidden" accept="image/*" onchange="handleProfilePhotoUpload(event)">
                      </div>

                      <div class="mt-4 pt-3.5 border-t border-slate-800/80 grid grid-cols-2 gap-3 text-xs">
                          <div>
                              <span class="text-slate-400 block text-[10px] uppercase font-semibold">Location / مقام</span>
                              <span id="hero-location" class="font-semibold text-slate-200">Chak 597 G/B Tandlianwala</span>
                          </div>
                          <div>
                              <span class="text-slate-400 block text-[10px] uppercase font-semibold">Status / حالت</span>
                              <span id="hero-status" class="font-semibold text-emerald-400 flex items-center gap-1.5">
                                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Active Profile
                              </span>
                          </div>
                      </div>

                      <p id="hero-bio" class="mt-3 text-xs text-slate-300 leading-relaxed italic bg-slate-800/60 p-3 rounded-2xl border border-slate-700/60">
                          "Welcome to my personal identity app. Here you will find detailed information about me, my work, and my family members."
                      </p>
                  </div>

                  <!-- Android Studio ZIP Generator Action Banner -->
                  <div onclick="downloadAndroidZip()" class="cursor-pointer bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 rounded-2xl p-4 text-white shadow-lg flex items-center justify-between hover:opacity-95 active:scale-95 transition transform">
                      <div class="space-y-1">
                          <div class="flex items-center gap-2">
                              <i class="fa-solid fa-file-zipper text-xl"></i>
                              <h4 class="font-bold text-xs uppercase tracking-wide">Generate Android Studio ZIP</h4>
                          </div>
                          <p class="text-[11px] text-amber-100">Click to package native Java source code to generate Android APK on PC</p>
                      </div>
                      <span class="bg-white/20 px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap">
                          Get ZIP
                      </span>
                  </div>

                  <!-- Family Roles Progress Matrix -->
                  <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/60 space-y-3">
                      <div class="flex items-center justify-between">
                          <div>
                              <h3 class="font-bold text-sm text-slate-900 dark:text-white">Family Profile Progress</h3>
                              <p class="text-xs text-slate-500 dark:text-slate-400 urdu-hint hidden">خاندانی معلومات کی صورتحال</p>
                          </div>
                          <span id="completed-count-badge" class="text-xs font-bold px-3 py-1 bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300 rounded-full">
                              0 / 6 Roles Filled
                          </span>
                      </div>

                      <!-- Roles Grid -->
                      <div id="roles-summary-grid" class="grid grid-cols-3 gap-2.5">
                          <!-- Populated dynamically via JS -->
                      </div>
                  </div>

                  <!-- Quick Downloader Banner -->
                  <div onclick="switchTab('downloader')" class="cursor-pointer bg-gradient-to-r from-emerald-600 to-teal-600 rounded-2xl p-4 text-white shadow-md flex items-center justify-between hover:opacity-95 active:scale-95 transition">
                      <div class="space-y-1">
                          <div class="flex items-center gap-2">
                              <i class="fa-solid fa-circle-down text-lg"></i>
                              <h4 class="font-bold text-xs">Real Video & Audio Downloader</h4>
                          </div>
                          <p class="text-[11px] text-emerald-100">Extract & save TikTok, YouTube & FB media directly to phone</p>
                      </div>
                      <i class="fa-solid fa-chevron-right text-xs bg-white/20 p-2 rounded-full"></i>
                  </div>

                  <!-- Filled Profile Question Snapshots -->
                  <div class="space-y-3">
                      <div class="flex items-center justify-between">
                          <h3 class="font-bold text-sm text-slate-900 dark:text-white">Questionnaire Overview</h3>
                          <button onclick="switchTab('questionnaire')" class="text-xs font-bold text-brand-600 dark:text-brand-400 hover:underline">Edit All →</button>
                      </div>

                      <div id="dashboard-snapshot-cards" class="space-y-3">
                          <!-- Dynamic snapshot cards -->
                      </div>
                  </div>
              </section>

              <!-- VIEW 2: QUESTIONNAIRE -->
              <section id="view-questionnaire" class="space-y-4 hidden">
                  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <h2 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                          <i class="fa-solid fa-clipboard-question text-brand-600"></i>
                          <span>Family & Personal Questionnaire</span>
                      </h2>
                      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                          Select a family member category below to answer or edit questions.
                      </p>
                      <p class="text-xs text-brand-600 font-medium urdu-hint hidden mt-1">
                          ہر فرد کے بارے میں الگ الگ سوالات کا جواب دیں اور محفوظ کریں۔
                      </p>
                  </div>

                  <!-- Role Selector Horizontal Tabs -->
                  <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="role-selector-tabs">
                      <!-- Dynamic Role Tabs -->
                  </div>

                  <!-- Dynamic Form Card -->
                  <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700/80">
                          <div class="flex items-center gap-3">
                              <div id="active-role-icon" class="w-10 h-10 rounded-xl bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300 flex items-center justify-center font-bold text-lg">
                                  <i class="fa-solid fa-user"></i>
                              </div>
                              <div>
                                  <h3 id="active-role-title" class="font-bold text-sm text-slate-900 dark:text-white">Myself (میں)</h3>
                                  <p id="active-role-subtitle" class="text-xs text-slate-500 dark:text-slate-400">Questions about your identity & work</p>
                              </div>
                          </div>

                          <button onclick="saveActiveRoleForm()" class="bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-semibold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm shadow-brand-500/30">
                              <i class="fa-solid fa-floppy-disk"></i> Save
                          </button>
                      </div>

                      <form id="questionnaire-form" class="space-y-4" onsubmit="event.preventDefault(); saveActiveRoleForm();">
                          <!-- Dynamic inputs injected here -->
                      </form>
                  </div>
              </section>

              <!-- VIEW 3: DOWNLOADER -->
              <section id="view-downloader" class="space-y-4 hidden">
                  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                      <div class="flex items-center justify-between">
                          <h2 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                              <i class="fa-solid fa-download text-brand-600"></i>
                              <span>Real Media Downloader</span>
                          </h2>
                          <span class="text-[10px] bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 px-2.5 py-1 rounded-full font-bold">Direct Save Active</span>
                      </div>
                      <p class="text-xs text-slate-500 dark:text-slate-400">
                          Paste any link (TikTok, YouTube, Facebook, Instagram) to extract real MP4 videos or MP3 audio directly to your device storage.
                      </p>

                      <!-- Link Input & Paste Action -->
                      <div class="space-y-2">
                          <div class="relative">
                              <input type="text" id="media-url-input" placeholder="Paste YouTube, TikTok, IG or FB video URL here..."
                                     class="w-full pl-9 pr-20 py-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-slate-800 dark:text-slate-100">
                              <i class="fa-solid fa-link absolute left-3 top-3 text-slate-400 text-xs"></i>
                              <button type="button" onclick="pasteFromClipboard()" class="absolute right-2 top-1.5 text-[11px] font-medium bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded-lg transition">
                                  Paste
                              </button>
                          </div>

                          <div class="grid grid-cols-2 gap-2">
                              <button onclick="processMediaDownload('video')" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-sm shadow-brand-500/20">
                                  <i class="fa-solid fa-file-video"></i> Download Video (MP4)
                              </button>
                              <button onclick="processMediaDownload('audio')" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-sm shadow-indigo-500/20">
                                  <i class="fa-solid fa-music"></i> Extract Audio (MP3)
                              </button>
                          </div>
                      </div>
                  </div>

                  <!-- Download Progress Bar -->
                  <div id="media-progress-card" class="hidden bg-white dark:bg-slate-800 p-4 rounded-2xl border border-brand-200 dark:border-brand-900 shadow-sm space-y-3">
                      <div class="flex items-center justify-between text-xs font-bold text-slate-800 dark:text-white">
                          <span id="download-status-title">Extracting Link...</span>
                          <span id="download-percentage" class="text-brand-600">0%</span>
                      </div>

                      <div class="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                          <div id="download-progress-bar" class="bg-gradient-to-r from-brand-500 to-emerald-400 h-full w-0 transition-all duration-300"></div>
                      </div>
                      <p id="download-status-detail" class="text-[11px] text-slate-500 dark:text-slate-400 italic">Connecting to live extraction server...</p>
                  </div>

                  <!-- Vault File List -->
                  <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                      <div class="flex items-center justify-between">
                          <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                              <i class="fa-solid fa-folder-closed text-amber-500"></i> My Downloaded Media Vault
                          </h3>
                          <span id="vault-count" class="text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full font-bold">0 Items</span>
                      </div>

                      <div id="vault-items-container" class="space-y-3">
                          <!-- Dynamic saved media -->
                      </div>
                  </div>
              </section>

              <!-- VIEW 4: SETTINGS & ANDROID ZIP -->
              <section id="view-settings" class="space-y-4 hidden">
                  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <h2 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                          <i class="fa-solid fa-sliders text-brand-600"></i>
                          <span>Android Developer & Data Tools</span>
                      </h2>
                      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                          Export as a full Android Studio project ZIP or backup/restore your saved profiles.
                      </p>
                  </div>

                  <!-- Android Studio ZIP Exporter Card -->
                  <div class="bg-gradient-to-br from-amber-500/10 via-orange-500/10 to-transparent p-4 rounded-2xl border border-amber-300/60 dark:border-amber-700/60 space-y-3">
                      <div class="flex items-center gap-3">
                          <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold text-xl shadow-md">
                              <i class="fa-solid fa-file-zipper"></i>
                          </div>
                          <div>
                              <h3 class="font-bold text-sm text-slate-900 dark:text-white">Android Studio ZIP Exporter</h3>
                              <p class="text-[11px] text-slate-500 dark:text-slate-400">Generates full native Android Java project ZIP</p>
                          </div>
                      </div>

                      <ul class="text-xs text-slate-600 dark:text-slate-300 space-y-1 list-disc list-inside">
                          <li>Includes <code class="bg-amber-100 dark:bg-amber-900/50 px-1 rounded">MainActivity.java</code> with DownloadManager</li>
                          <li>Includes <code class="bg-amber-100 dark:bg-amber-900/50 px-1 rounded">AndroidManifest.xml</code> with permissions</li>
                          <li>Includes <code class="bg-amber-100 dark:bg-amber-900/50 px-1 rounded">index.html</code> assets & setup guide</li>
                      </ul>

                      <button onclick="downloadAndroidZip()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-600 text-white font-extrabold text-xs rounded-xl shadow-lg hover:opacity-95 active:scale-95 transition flex items-center justify-center gap-2">
                          <i class="fa-solid fa-download text-base"></i> Download Android Studio Project ZIP
                      </button>
                  </div>

                  <!-- Profile Data Backup & Export -->
                  <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                      <h3 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                          <i class="fa-solid fa-database text-brand-500"></i> Profile Data Backup & Print
                      </h3>

                      <div class="grid grid-cols-2 gap-2">
                          <button onclick="exportDataJSON()" class="p-3 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-xl text-xs font-semibold flex flex-col items-center gap-1.5 transition border border-slate-200 dark:border-slate-600">
                              <i class="fa-solid fa-file-export text-lg text-brand-600"></i>
                              Export Data JSON
                          </button>

                          <button onclick="triggerImportJSON()" class="p-3 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-xl text-xs font-semibold flex flex-col items-center gap-1.5 transition border border-slate-200 dark:border-slate-600">
                              <i class="fa-solid fa-file-import text-lg text-indigo-600"></i>
                              Import Backup File
                          </button>
                          <input type="file" id="import-file-input" class="hidden" accept=".json" onchange="importDataJSON(event)">
                      </div>

                      <button onclick="generatePrintableCard()" class="w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 hover:opacity-95 active:scale-95 transition">
                          <i class="fa-solid fa-id-card"></i> View Printable Personal Identity Card
                      </button>
                  </div>

                  <!-- Reset Data Trigger -->
                  <div class="bg-red-50 dark:bg-red-950/30 rounded-2xl p-4 border border-red-200 dark:border-red-900/50 space-y-2">
                      <h3 class="font-bold text-xs text-red-800 dark:text-red-300">Reset Local App Storage</h3>
                      <p class="text-[11px] text-red-600 dark:text-red-400">
                          This will clear all saved questions and local vault files from this phone.
                      </p>
                      <button onclick="openConfirmResetModal()" class="py-2 px-3 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold text-xs rounded-xl transition">
                          Reset Local Data
                      </button>
                  </div>
              </section>

          </main>

          <!-- Bottom Fixed Navigation Bar -->
          <nav class="fixed bottom-0 max-w-md w-full bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-2 py-2 grid grid-cols-4 gap-1 z-40">
              <button id="nav-dashboard" onclick="switchTab('dashboard')" class="flex flex-col items-center py-1 rounded-xl text-brand-600 active-tab transition">
                  <i class="fa-solid fa-house text-base"></i>
                  <span class="text-[10px] font-bold mt-1">Dashboard</span>
              </button>

              <button id="nav-questionnaire" onclick="switchTab('questionnaire')" class="flex flex-col items-center py-1 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                  <i class="fa-solid fa-clipboard-list text-base"></i>
                  <span class="text-[10px] font-bold mt-1">Questions</span>
              </button>

              <button id="nav-downloader" onclick="switchTab('downloader')" class="flex flex-col items-center py-1 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                  <i class="fa-solid fa-circle-down text-base"></i>
                  <span class="text-[10px] font-bold mt-1">Downloader</span>
              </button>

              <button id="nav-settings" onclick="switchTab('settings')" class="flex flex-col items-center py-1 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                  <i class="fa-solid fa-gear text-base"></i>
                  <span class="text-[10px] font-bold mt-1">Android/ZIP</span>
              </button>
          </nav>

          <!-- Toast Feedback Notification -->
