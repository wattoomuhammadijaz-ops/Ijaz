                  <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 flex items-center justify-center text-xl mx-auto">
                      <i class="fa-solid fa-triangle-exclamation"></i>
                  </div>
                  <h3 class="font-bold text-sm text-slate-900 dark:text-white">Reset All App Data?</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">
                      This will delete all saved profile questions and local vault files.
                  </p>
                  <div class="grid grid-cols-2 gap-2 pt-2">
                      <button onclick="closeConfirmResetModal()" class="py-2 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-xl font-bold text-xs">
                          Cancel
                      </button>
