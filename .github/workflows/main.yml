      </div>

      <script>
          // Roles and Question Definitions
          const ROLES_DEFINITION = {
              myself: {
                  id: 'myself',
                  title: 'Myself (میں)',
                  subtitle: 'Who I Am & What I Do',
                  icon: 'fa-user-tie',
                  questions: [
                      { id: 'full_name', label: 'Full Name / پورا نام', type: 'text', default: 'IJAZ WA2' },
                      { id: 'who_am_i', label: 'Who Am I? (Summary / مختصر تعارف)', type: 'textarea', default: 'I am a passionate software enthusiast and technology creator.' },
                      { id: 'what_i_do', label: 'What Do I Do? (Profession/Role / شعبہ یا کام)', type: 'text', default: 'Software Developer & Tech Creator' },
                      { id: 'location', label: 'Location / مقام', type: 'text', default: 'Chak 597 G/B Tandlianwala' },
                      { id: 'goals', label: 'Major Life Goals / زندگی کے اہم مقاصد', type: 'textarea', default: 'To build impactful digital tools for my community and family.' },
                      { id: 'hobbies', label: 'Hobbies & Interests / مشغلے', type: 'text', default: 'Coding, Reading, Mobile Tech, Travelling' },
                      { id: 'favorite_quote', label: 'Favorite Quote / پسندیدہ قول', type: 'text', default: 'Continuous learning is the key to success.' },
                      { id: 'contact_info', label: 'Phone / Social Link / رابطہ نمبر', type: 'text', default: '+92 300 1234567' }
                  ]
              },
              father: {
                  id: 'father',
                  title: 'Father (والد محترم)',
                  subtitle: 'Father\'s details & guidance',
                  icon: 'fa-user-shield',
                  questions: [
                      { id: 'father_name', label: 'Father\'s Full Name / والد محترم کا نام', type: 'text', default: '' },
                      { id: 'father_occupation', label: 'Occupation / شعبہ یا پیشہ', type: 'text', default: '' },
                      { id: 'best_advice', label: 'Best Life Advice He Gave / ان کی بہترین نصیحت', type: 'textarea', default: '' },
                      { id: 'admired_quality', label: 'What You Admire Most About Him / ان کی سب سے اچھی عادت', type: 'text', default: '' },
                      { id: 'favorite_memory', label: 'Best Shared Memory Together / یادگار لمحات', type: 'textarea', default: '' }
                  ]
              },
              mother: {
                  id: 'mother',
                  title: 'Mother (والدہ محترمہ)',
                  subtitle: 'Mother\'s special details & affection',
                  icon: 'fa-heart',
                  questions: [
                      { id: 'mother_name', label: 'Mother\'s Name / والدہ کا نام', type: 'text', default: '' },
                      { id: 'mother_specialty', label: 'Special Qualities & Care / ان کی خصوصیات', type: 'textarea', default: '' },
                      { id: 'favorite_dish', label: 'Favorite Food She Cooks / پسندیدہ کھانا', type: 'text', default: '' },
                      { id: 'cherished_moment', label: 'Cherished Moment With Her / یادگار لمحہ', type: 'textarea', default: '' }
                  ]
              },
              brother: {
                  id: 'brother',
                  title: 'Brother (بھائی)',
                  subtitle: 'Brother details & memories',
                  icon: 'fa-user-group',
                  questions: [
                      { id: 'brother_name', label: 'Brother\'s Name / بھائی کا نام', type: 'text', default: '' },
                      { id: 'brother_relation', label: 'Elder or Younger? / بڑے یا چھوٹے؟', type: 'text', default: 'Elder' },
                      { id: 'brother_profession', label: 'Profession or Studies / کام یا تعلیم', type: 'text', default: '' },
                      { id: 'funny_memory', label: 'Funniest Shared Memory / مزاحیہ واقعہ', type: 'textarea', default: '' }
                  ]
              },
              sister: {
                  id: 'sister',
                  title: 'Sister (بہن)',
                  subtitle: 'Sister details & affection',
                  icon: 'fa-users',
                  questions: [
                      { id: 'sister_name', label: 'Sister\'s Name / بہن کا نام', type: 'text', default: '' },
                      { id: 'sister_relation', label: 'Elder or Younger? / بڑی یا چھوٹی؟', type: 'text', default: '' },
                      { id: 'sister_qualities', label: 'Her Best Traits & Hobbies / خصوصیات', type: 'textarea', default: '' },
                      { id: 'sister_memory', label: 'Special Memory / خاص یاد', type: 'textarea', default: '' }
                  ]
              },
              cousin: {
                  id: 'cousin',
                  title: 'Cousin (کزن)',
                  subtitle: 'Cousins & friends circle details',
                  icon: 'fa-user-plus',
                  questions: [
                      { id: 'cousin_name', label: 'Cousin\'s Name / کزن کا نام', type: 'text', default: '' },
                      { id: 'cousin_relation', label: 'Which Side? (Paternal/Maternal) / تعلق', type: 'text', default: 'Paternal' },
                      { id: 'cousin_hangout', label: 'Best Memories or Trips / خوبصورت لمحات', type: 'textarea', default: '' },
                      { id: 'cousin_contact', label: 'Contact / Social Handle / رابطہ', type: 'text', default: '' }
                  ]
              }
          };

          // Application State
          let appState = {
              activeRole: 'myself',
              formData: {},
              downloadedVault: [],
              isUrduVisible: false
          };

          // Initialization on window load
          window.addEventListener('DOMContentLoaded', () => {
              loadSavedData();
              renderRolesTabs();
              renderRoleForm(appState.activeRole);
              renderDashboard();
              renderVaultItems();
          });

          // Load persisted data from localStorage
          function loadSavedData() {
              try {
                  const storedForm = localStorage.getItem('ijaz_app_form_data');
                  if (storedForm) {
                      appState.formData = JSON.parse(storedForm);
                      if (!appState.formData['myself_full_name'] || appState.formData['myself_full_name'] === 'Ijaz Ahmad') {
                          appState.formData['myself_full_name'] = 'IJAZ WA2';
                      }
                      if (!appState.formData['myself_location']) {
                          appState.formData['myself_location'] = 'Chak 597 G/B Tandlianwala';
                      }
                  } else {
                      appState.formData = {};
                      ROLES_DEFINITION.myself.questions.forEach(q => {
                          appState.formData[`myself_${q.id}`] = q.default;
                      });
                  }

                  const storedVault = localStorage.getItem('ijaz_app_vault');
                  if (storedVault) {
                      appState.downloadedVault = JSON.parse(storedVault);
                  } else {
                      appState.downloadedVault = [];
                  }
              } catch (e) {
                  console.error("Error loading localStorage data", e);
              }
          }

          function saveData() {
              try {
                  localStorage.setItem('ijaz_app_form_data', JSON.stringify(appState.formData));
                  localStorage.setItem('ijaz_app_vault', JSON.stringify(appState.downloadedVault));
              } catch (e) {
                  console.error("Error saving localStorage data", e);
              }
          }

          // Tab Switching logic
          function switchTab(tabId) {
              ['dashboard', 'questionnaire', 'downloader', 'settings'].forEach(v => {
                  const el = document.getElementById(`view-${v}`);
                  const nav = document.getElementById(`nav-${v}`);
                  if (v === tabId) {
                      if (el) el.classList.remove('hidden');
                      if (nav) {
                          nav.classList.add('text-brand-600', 'active-tab');
                          nav.classList.remove('text-slate-400');
                      }
                  } else {
                      if (el) el.classList.add('hidden');
                      if (nav) {
                          nav.classList.remove('text-brand-600', 'active-tab');
                          nav.classList.add('text-slate-400');
                      }
                  }
              });

              if (tabId === 'dashboard') {
                  renderDashboard();
              }
          }

          function toggleDarkMode() {
              const html = document.documentElement;
              const icon = document.getElementById('theme-icon');
              if (html.classList.contains('dark')) {
                  html.classList.remove('dark');
                  if (icon) icon.className = 'fa-solid fa-moon text-xs';
              } else {
                  html.classList.add('dark');
                  if (icon) icon.className = 'fa-solid fa-sun text-xs text-amber-400';
              }
          }

          function toggleUrduLabels() {
              appState.isUrduVisible = !appState.isUrduVisible;
              document.querySelectorAll('.urdu-hint').forEach(el => {
                  if (appState.isUrduVisible) el.classList.remove('hidden');
                  else el.classList.add('hidden');
              });
              showToast(appState.isUrduVisible ? 'اردو معلومات فعال ہیں' : 'English mode active');
          }

          function renderRolesTabs() {
              const container = document.getElementById('role-selector-tabs');
              if (!container) return;

              container.innerHTML = Object.keys(ROLES_DEFINITION).map(roleKey => {
                  const role = ROLES_DEFINITION[roleKey];
                  const isActive = roleKey === appState.activeRole;
                  const activeClass = isActive
                      ? 'bg-brand-600 text-white shadow-md shadow-brand-500/20'
                      : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700';

                  return `
                      <button onclick="selectRole('${roleKey}')" class="whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${activeClass}">
                          <i class="fa-solid ${role.icon}"></i>
                          <span>${role.title.split(' ')[0]}</span>
                      </button>
                  `;
              }).join('');
          }

          function selectRole(roleKey) {
              appState.activeRole = roleKey;
              renderRolesTabs();
              renderRoleForm(roleKey);
          }

          function renderRoleForm(roleKey) {
              const role = ROLES_DEFINITION[roleKey];
              if (!role) return;

              const titleEl = document.getElementById('active-role-title');
              const subTitleEl = document.getElementById('active-role-subtitle');
              const iconEl = document.getElementById('active-role-icon');

              if (titleEl) titleEl.innerText = role.title;
              if (subTitleEl) subTitleEl.innerText = role.subtitle;
              if (iconEl) iconEl.innerHTML = `<i class="fa-solid ${role.icon}"></i>`;

              const form = document.getElementById('questionnaire-form');
              if (!form) return;

              form.innerHTML = role.questions.map(q => {
                  const fieldKey = `${roleKey}_${q.id}`;
                  const val = appState.formData[fieldKey] !== undefined ? appState.formData[fieldKey] : (q.default || '');

                  if (q.type === 'textarea') {
                      return `
                          <div class="space-y-1">
                              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">${q.label}</label>
                              <textarea id="field_${fieldKey}" rows="3" class="w-full p-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-slate-800 dark:text-slate-100" placeholder="Type answer here...">${val}</textarea>
                          </div>
                      `;
                  }

                  return `
                      <div class="space-y-1">
                          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">${q.label}</label>
                          <input type="text" id="field_${fieldKey}" value="${val}" class="w-full p-2.5 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-slate-800 dark:text-slate-100" placeholder="Type answer here...">
                      </div>
                  `;
              }).join('');
          }

          function saveActiveRoleForm() {
              const roleKey = appState.activeRole;
              const role = ROLES_DEFINITION[roleKey];

              role.questions.forEach(q => {
                  const fieldKey = `${roleKey}_${q.id}`;
                  const input = document.getElementById(`field_${fieldKey}`);
                  if (input) {
                      appState.formData[fieldKey] = input.value.trim();
                  }
              });

              saveData();
              showToast(`${role.title.split(' ')[0]} details saved!`);
              renderDashboard();
          }

          function triggerProfilePhotoUpload() {
              const input = document.getElementById('profile-photo-input');
              if (input) input.click();
          }

          function handleProfilePhotoUpload(event) {
              const file = event.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = function(e) {
                  const photoDataUrl = e.target.result;
                  appState.formData['myself_profile_photo'] = photoDataUrl;
                  saveData();
                  renderDashboard();
                  showToast('Profile photo updated successfully!');
              };
              reader.readAsDataURL(file);
          }

          function renderDashboard() {
              const myName = appState.formData['myself_full_name'] || 'IJAZ WA2';
              const myRole = appState.formData['myself_what_i_do'] || 'Software Developer & Tech Creator';
              const myLoc = appState.formData['myself_location'] || 'Chak 597 G/B Tandlianwala';
              const myBio = appState.formData['myself_who_am_i'] || 'Welcome to my personal identity application.';
              const profilePhoto = appState.formData['myself_profile_photo'];

              const nameEl = document.getElementById('hero-name');
              const roleEl = document.getElementById('hero-role');
              const locEl = document.getElementById('hero-location');
              const bioEl = document.getElementById('hero-bio');
              const avatarEl = document.getElementById('hero-avatar');

              if (nameEl) nameEl.innerText = myName;
              if (roleEl) roleEl.innerText = myRole;
              if (locEl) locEl.innerText = myLoc;
              if (bioEl) bioEl.innerText = `"${myBio}"`;

              if (avatarEl) {
                  if (profilePhoto) {
                      avatarEl.innerHTML = `<img src="${profilePhoto}" alt="${myName}" class="w-full h-full object-cover rounded-2xl">`;
                  } else {
                      const initials = myName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                      avatarEl.innerText = initials || 'IW';
                  }
              }

              let filledCount = 0;
              const rolesKeys = Object.keys(ROLES_DEFINITION);

              rolesKeys.forEach(rk => {
                  const role = ROLES_DEFINITION[rk];
                  const hasFilled = role.questions.some(q => (appState.formData[`${rk}_${q.id}`] || '').trim().length > 0);
                  if (hasFilled) filledCount++;
              });

              const badge = document.getElementById('completed-count-badge');
              if (badge) badge.innerText = `${filledCount} / ${rolesKeys.length} Roles Filled`;

              const gridContainer = document.getElementById('roles-summary-grid');
              if (gridContainer) {
                  gridContainer.innerHTML = rolesKeys.map(rk => {
                      const role = ROLES_DEFINITION[rk];
                      const isFilled = role.questions.some(q => (appState.formData[`${rk}_${q.id}`] || '').trim().length > 0);

                      return `
                          <div onclick="selectRole('${rk}'); switchTab('questionnaire');" class="cursor-pointer p-2.5 rounded-xl border ${isFilled ? 'bg-brand-50/60 dark:bg-brand-950/20 border-brand-200 dark:border-brand-800' : 'bg-slate-100 dark:bg-slate-900 border-slate-200 dark:border-slate-800'} text-center space-y-1 hover:scale-105 active:scale-95 transition">
                              <i class="fa-solid ${role.icon} ${isFilled ? 'text-brand-600' : 'text-slate-400'} text-base"></i>
                              <h5 class="font-bold text-[11px] text-slate-800 dark:text-slate-200 truncate">${role.title.split(' ')[0]}</h5>
                              <span class="block text-[9px] ${isFilled ? 'text-brand-600 font-bold' : 'text-slate-400'}">
                                  ${isFilled ? '✓ Filled' : 'Empty'}
                              </span>
                          </div>
                      `;
                  }).join('');
              }

              const snapshotCards = document.getElementById('dashboard-snapshot-cards');
              if (snapshotCards) {
                  const cardsHtml = rolesKeys.map(rk => {
                      const role = ROLES_DEFINITION[rk];
                      const filledQuestions = role.questions.filter(q => (appState.formData[`${rk}_${q.id}`] || '').trim().length > 0);

                      if (filledQuestions.length === 0) return '';

                      return `
                          <div class="bg-white dark:bg-slate-800/90 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-700/60 shadow-sm space-y-2">
                              <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-700/60">
                                  <div class="flex items-center gap-2">
                                      <div class="w-7 h-7 rounded-lg bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300 flex items-center justify-center font-bold text-xs">
                                          <i class="fa-solid ${role.icon}"></i>
                                      </div>
                                      <h4 class="font-bold text-xs text-slate-900 dark:text-white">${role.title}</h4>
                                  </div>
                                  <button onclick="selectRole('${rk}'); switchTab('questionnaire');" class="text-[11px] text-brand-600 font-bold hover:underline">Edit</button>
                              </div>
                              <div class="space-y-1">
                                  ${filledQuestions.slice(0, 3).map(q => `
                                      <div class="text-xs">
                                          <span class="text-slate-400 dark:text-slate-500 font-medium">${q.label.split('/')[0]}:</span>
                                          <span class="text-slate-800 dark:text-slate-200 font-semibold ml-1">${appState.formData[`${rk}_${q.id}`]}</span>
                                      </div>
                                  `).join('')}
                              </div>
                          </div>
                      `;
                  }).join('');

                  snapshotCards.innerHTML = cardsHtml || `
                      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center text-xs text-slate-400">
                          No family questionnaire details added yet. Click "Questions" below to start filling.
                      </div>
                  `;
              }
          }

